<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Problem solving</title>
  </head>

  <body>
    <script>
      // Swapping Letters
      let Swappingcase = "elZERo";
      let Swapping = Swappingcase.split("")
        .map((letter) =>
          letter === letter.toUpperCase()
            ? letter.toLowerCase()
            : letter.toUpperCase(),
        )
        .join("");
      console.log(Swappingcase);
      console.log(Swapping);
      
      // convert Element in Array
      let invertedNumber = [1, -10, -20, 15, 100, -30];
      let newArray = invertedNumber.map((element) => -element);
      console.log(invertedNumber);
      console.log(newArray);

      // prevent Letters
      let ignoreNumber = "Elz123er4o";
      let number = ignoreNumber.split("").map((element)=> {
        if (isNaN(element)) {
          return element;
        }
        return "";
      }
    ).join("")
    console.log(ignoreNumber)
    console.log(number)
    
    </script>
  </body>
</html>
